name: Deploy S1 Dashboard & Send Telegram Report

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Runs at 13:30 UTC (17:00 Tehran Time) on Saturday, Sunday, Monday, Tuesday, Wednesday, Thursday
    - cron: '30 13 * * 0,1,2,3,4,6'
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'deploy_only'
          - 'report_only'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Deploy Static Dashboard to GitHub Pages
  # -------------------------------------------------------------
  deploy-github-pages:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.action_type == 'all' || github.event.inputs.action_type == 'deploy_only'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------
  # Job 2: Process System S1 Data, Run Gemini AI, & Send Telegram Report
  # -------------------------------------------------------------
  send-telegram-report:
    name: Generate & Send Telegram Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.action_type == 'all' || github.event.inputs.action_type == 'report_only'))
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute S1 Daily Telegram Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run send-report
